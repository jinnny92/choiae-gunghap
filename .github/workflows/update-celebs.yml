name: 셀럽 목록 자동 업데이트

on:
  schedule:
    - cron: '17 18 * * 0'   # 매주 월요일 03:17 (한국시간)
  workflow_dispatch:          # Actions 탭에서 수동 실행 가능

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Wikidata에서 받아오기
        run: node tools/fetch_celebs.mjs
      - name: 바뀐 내용 있으면 커밋
        run: |
          if git diff --quiet -- celebs.js; then
            echo "변경 없음"
          else
            git config user.name "celeb-sync-bot"
            git config user.email "celeb-sync-bot@users.noreply.github.com"
            git add celebs.js
            git commit -m "셀럽 목록 자동 업데이트"
            git push
          fi
